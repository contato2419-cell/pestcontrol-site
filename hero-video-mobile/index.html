<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1120; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d1120; }
      /* PC: foto ocupa a direita e some no escuro à esquerda, onde entra o texto do site */
      .stage { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; overflow: hidden; }
      .shot { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; transform-origin: 60% 60%; }
      #s1 { inset: auto; left: -49%; top: -80%; width: 180%; height: 180%; object-position: 50% 50%; transform-origin: 50% 62%; }
      #s2 { object-position: 50% 48%; }
      #s3 { object-position: 50% 62%; }
      .fade { position: absolute; inset: 0;
        background: none; }
      #smoke { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="stage" class="stage clip" data-start="0" data-duration="15" data-track-index="0"
           data-layout-allow-overflow data-layout-allow-overlap>
        <img id="s1" class="shot" src="assets/a.jpg" alt="" />
        <img id="s2" class="shot" src="assets/b.jpg" alt="" />
        <img id="s3" class="shot" src="assets/c.jpg" alt="" />
      </div>
      <div id="fade" class="fade clip" data-start="0" data-duration="15" data-track-index="1"></div>
      <canvas id="smoke" class="clip" data-start="0" data-duration="15" data-track-index="2"></canvas>
    </div>
    <script id="fs" type="x-shader/x-fragment">
      precision highp float;
      uniform vec2 uRes; uniform float uT;
      const float T = 15.0;
      float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
      float fbm(vec2 p){ float a=.5,s=0.; mat2 m=mat2(1.6,1.2,-1.2,1.6);
        for(int i=0;i<5;i++){ s+=a*noise(p); p=m*p; a*=.5; } return s; }
      float cloud(vec2 p){ vec2 q=vec2(fbm(p+vec2(1.7,9.2)),fbm(p+vec2(8.3,2.8))); return fbm(p+.95*q); }
      /* duas camadas que escorrem e se revezam: o fim do vídeo encaixa exato no começo */
      float layered(vec2 p){
        float a=fract(uT/T), b=fract(uT/T+.5);
        float wa=1.-abs(2.*a-1.), wb=1.-wa;
        vec2 flow=vec2(-.75,1.05);
        float d1=cloud(p-flow*(a-.5));
        float d2=cloud(p-flow*(b-.5)+vec2(3.1,1.7));
        return .5+((d1-.5)*wa+(d2-.5)*wb)/sqrt(wa*wa+wb*wb);
      }
      float peak(float t,float c){ float d=t-c; return exp(-d*d/1.1); }
      void main(){
        vec2 uv=gl_FragCoord.xy/uRes;
        float asp=uRes.x/uRes.y;
        vec2 p=vec2(uv.x*asp,uv.y)*1.75;
        float d=layered(p);
        float l=layered(p+vec2(.09,.12));
        float env=peak(uT,0.)+peak(uT,5.)+peak(uT,10.)+peak(uT,15.);
        float ground=smoothstep(.95,.0,uv.y);
        float side=asp>1.?smoothstep(.12,.62,uv.x):1.;
        float a=smoothstep(.40,.98,d+ground*.42+(.20+env*.09)*side);
        a*=(.80+.10*env)*(.62+.38*side);
        float shade=clamp((d-l)*2.6+.70,0.,1.);
        vec3 col=mix(vec3(.58,.64,.64),vec3(.94,.97,.96),shade);
        col=mix(col,vec3(.42,.80,.36),.09);
        gl_FragColor=vec4(col*a,a);
      }
    </script>
    <script>
      const cv = document.getElementById("smoke");
      const k = Math.min(1, 640 / Math.max(cv.clientWidth, cv.clientHeight));
      cv.width = Math.round(cv.clientWidth * k);
      cv.height = Math.round(cv.clientHeight * k);
      const gl = cv.getContext("webgl", { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
      const sh = (ty, src) => { const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
      gl.linkProgram(pr); gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0); gl.bindAttribLocation(pr, 0, "a"); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.linkProgram(pr); gl.useProgram(pr);
      gl.uniform2f(gl.getUniformLocation(pr, "uRes"), cv.width, cv.height);
      const uT = gl.getUniformLocation(pr, "uT");
      function renderAt(t) {
        gl.viewport(0, 0, cv.width, cv.height);
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      const n = "none";
      gsap.set("#s2,#s3", { opacity: 0 });
      gsap.set("#s3", { opacity: 0.5 });
      tl.fromTo("#s1", { scale: 1.015 }, { scale: 1.1, duration: 5.7, ease: n }, 0);
      tl.fromTo("#s1", { scale: 1 }, { scale: 1.015, duration: 0.7, ease: n, immediateRender: false }, 14.3);
      tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: n, immediateRender: false }, 4.75);
      tl.fromTo("#s2", { scale: 1 }, { scale: 1.09, duration: 6.4, ease: n, immediateRender: false }, 4.3);
      tl.fromTo("#s3", { opacity: 0.5 }, { opacity: 0, duration: 0.25, ease: n }, 0);
      tl.fromTo("#s3", { scale: 1.08 }, { scale: 1.085, duration: 0.25, ease: n }, 0);
      tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: n, immediateRender: false }, 9.75);
      tl.fromTo("#s3", { opacity: 1 }, { opacity: 0.5, duration: 0.25, ease: n, immediateRender: false }, 14.75);
      tl.set("#s2", { opacity: 0 }, 10.8);
      tl.fromTo("#s3", { scale: 1 }, { scale: 1.08, duration: 5.7, ease: n, immediateRender: false }, 9.3);
      tl.set({}, {}, 15);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
